name: Deploy Quarto site to Pages

on:
  # Run CI for PRs targeting main
  pull_request:
    branches: [main]

  # Build + deploy on pushes to main
  push:
    branches: [main]
    # Ignore changes to workflow files themselves (e.g. bot commits that update
    # actions/checkout). Without this, a bot push cancels any in-progress deploy
    # via the concurrency group above. Trade-off: to test a workflow-only change,
    # use "Run workflow" manually from the Actions tab instead of pushing.
    paths-ignore:
      - '.github/**'

  # Manual trigger (optional rebuild)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent overlapping deployments
concurrency:
  group: pages
  cancel-in-progress: true


jobs:

  render:
    name: Render Quarto site
    runs-on: ubuntu-latest

    steps:
      # Get repository code
      - name: Checkout
        uses: actions/checkout@v7

      # Install Quarto
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tinytex: true  # optional PDF support

      # Install R with fast binary packages (RSPM)
      - name: Set up R (RSPM)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true

      # Install required R packages
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages:
            any::knitr
            any::rmarkdown
            any::kableExtra
            any::ggplot2
            any::data.table
            any::tufte
            any::modelsummary
            any::treemap
            any::ggfittext
            any::RefManageR
            any::ggrepel

      # Render Quarto site
      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      # Save build output for deploy job
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .


  deploy:
    name: Deploy to GitHub Pages
    needs: render

    # Only deploy from main branch pushes
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Configure Pages environment
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Publish site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
