# Workflow for rendering and deploying quarto site to GitHub Pages
# Based on the GitHub example static content deploy action
name: Deploy Quarto site to Pages

on:
  # Run CI (continuous integration) when a PR targets main (this is what you want for branch protection)
  pull_request:
    branches: ["main"]
  # Run CI + deploy when code is pushed to main
  push:
    branches: ["main"]
  # Allow manual run from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
# Permissions:
# - For PR builds, only read permissions are needed.
# - For deployments to Pages, pages + id-token are needed.
#   (GitHub is fine with having these set globally.)
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  render-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: nstall TinyTeX
        uses: quarto-dev/quarto-actions/install-tinytex@v2

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'

      - name: Install R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages:
            any::knitr
            any::rmarkdown
            any::kableExtra
            any::ggplot2
            any::data.table
            any::tufte
            any::modelsummary
            any::treemap
            any::ggfittext
            any::RefManageR
            any::ggrepel

      # Render the site
      # This will fail the workflow if rendering fails,
      # which is exactly what you want for CI.
      - name: Render
        uses: quarto-dev/quarto-actions/render@v2

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Upload the rendered output as an artifact
      # so the deploy job can reuse it.
      #
      # IMPORTANT:
      # Your original workflow used:
      #   path: 'posts'
      #
      # Keep it the same here to avoid breaking your deployment.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload quarto render output directory
          #path: '_site'
          target: gh-pages
          path: 'posts'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
